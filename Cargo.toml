[package]
name = "pulith"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
description = "Composable typed behaviors for external-resource management"
repository = "https://github.com/nostalume/pulith"
homepage = "https://github.com/nostalume/pulith"
readme = "README.md"
include = [
    "/src/**",
    "/tests/**",
    "/AGENTS.md",
    "/Cargo.toml",
    "/Cargo.lock",
    "/LICENSE",
    "/README.md",
]

[features]
default = ["local"]
local = ["dep:rustix", "dep:same-file", "dep:tempfile", "dep:walkdir", "dep:windows-sys"]
process = ["local"]
net = ["dep:url", "dep:httpdate", "dep:governor"]
http-sync = ["net", "local", "dep:ureq"]
http-async = ["net", "local", "dep:tokio", "dep:reqwest"]
process-async = ["process", "dep:tokio"]
hash = []
serde = ["dep:serde"]
blake3 = ["hash", "dep:blake3", "dep:hex"]
sha2 = ["hash", "dep:sha2", "dep:hex"]
zip = ["local", "dep:zip"]
tar = ["local", "dep:tar"]
gzip = ["tar", "dep:flate2"]
xz = ["tar", "dep:xz2"]
zstd = ["tar", "dep:zstd"]

[dependencies]
blake3 = { version = "1.8", optional = true }
serde = { version = "1", optional = true }
flate2 = { version = "1.1.8", optional = true }
governor = { version = "0.10", default-features = false, features = ["std"], optional = true }
hex = { version = "0.4", optional = true }
httpdate = { version = "1.0.3", optional = true }
reqwest = { version = "0.13", default-features = false, features = ["rustls"], optional = true }
same-file = { version = "1", optional = true }
sha2 = { version = "0.10", optional = true }
tar = { version = "0.4.45", optional = true }
tempfile = { version = "3", optional = true }
tokio = { version = "1", features = ["fs", "io-util", "net", "process", "rt", "rt-multi-thread", "time"], optional = true }
ureq = { version = "3.3", default-features = false, features = ["rustls"], optional = true }
url = { version = "2.5", features = ["serde"], optional = true }
walkdir = { version = "2.5", optional = true }
xz2 = { version = "0.1.7", optional = true }
zip = { version = "8.4.0", optional = true }
zstd = { version = "0.13.3", optional = true }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs", "process"], optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_SystemServices", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_Security"], optional = true }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
tempfile = "3"
toml = "0.9"

[[example]]
name = "vtool"
required-features = ["local", "http-sync", "zip", "tar", "gzip", "blake3", "sha2", "serde"]

[package]
name = "pulith"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Composable typed behaviors for acquiring, verifying, preparing, and applying artifacts"
repository = "https://github.com/lvyuemeng/pulith"

[features]
default = ["local", "sync"]
sync = []
async = []
runtime-tokio = ["async", "dep:tokio"]
local = ["dep:same-file", "dep:tempfile", "dep:walkdir"]
net = ["local", "dep:url", "dep:httpdate", "dep:governor"]
reqwest = ["net", "runtime-tokio", "dep:reqwest"]
ureq = ["net", "sync", "dep:ureq"]
hash = []
blake3 = ["hash", "dep:blake3", "dep:hex"]
sha2 = ["hash", "dep:sha2", "dep:hex"]
zip = ["local", "dep:zip"]
tar = ["local", "dep:tar"]
gzip = ["tar", "dep:flate2"]
xz = ["tar", "dep:xz2"]
zstd = ["tar", "dep:zstd"]

[dependencies]
blake3 = { version = "1.8", optional = true }
flate2 = { version = "1.1.8", optional = true }
governor = { version = "0.10", default-features = false, features = ["std"], optional = true }
hex = { version = "0.4", optional = true }
httpdate = { version = "1.0.3", optional = true }
reqwest = { version = "0.13", default-features = false, features = ["rustls"], optional = true }
same-file = { version = "1", optional = true }
sha2 = { version = "0.10", optional = true }
tar = { version = "0.4.45", optional = true }
tempfile = { version = "3", optional = true }
tokio = { version = "1", features = ["fs", "io-util", "net", "rt", "rt-multi-thread", "time"], optional = true }
ureq = { version = "3.3", default-features = false, features = ["rustls"], optional = true }
url = { version = "2.5", features = ["serde"], optional = true }
walkdir = { version = "2.5", optional = true }
xz2 = { version = "0.1.7", optional = true }
zip = { version = "8.4.0", optional = true }
zstd = { version = "0.13.3", optional = true }
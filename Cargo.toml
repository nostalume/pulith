[package]
name = "pulith"
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
description = "Composable typed behaviors for external-resource management"
repository = "https://github.com/nostalume/pulith"
homepage = "https://github.com/nostalume/pulith"
documentation = "https://docs.rs/pulith"
readme = "README.md"
keywords = ["artifacts", "resources", "deployment", "filesystem", "process"]
categories = ["filesystem", "development-tools"]
include = [
    "/src/**",
    "/tests/**",
    "/examples/**",
    "/docs/**",
    "/CONTRIBUTING.md",
    "/Cargo.toml",
    "/LICENSE",
    "/README.md",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["local"]
local = ["dep:rustix", "dep:tempfile", "dep:walkdir", "dep:windows-sys"]
process = ["local"]
net = ["dep:url", "dep:httpdate", "dep:governor"]
http-ureq = ["net", "local", "dep:ureq"]
hash = []
serde = ["dep:serde"]
blake3 = ["hash", "local", "dep:blake3", "dep:hex"]
sha2 = ["hash", "local", "dep:sha2", "dep:hex"]
archive = ["zip", "tar"]
# `zip` needs one deflate backend; `flate2` supplies the one this crate already trusts. pulith
# itself never composes a codec: no API in this crate wraps a decoder.
zip = ["dep:zip", "dep:flate2"]
tar = ["dep:tar"]

[dependencies]
blake3 = { version = "1.8", optional = true }
serde = { version = "1", optional = true }
flate2 = { version = "1.1.10", optional = true }
governor = { version = "0.10", default-features = false, features = ["std"], optional = true }
hex = { version = "0.4", optional = true }
httpdate = { version = "1.0.3", optional = true }
sha2 = { version = "0.10", optional = true }
tar = { version = "0.4.46", optional = true }
tempfile = { version = "3", optional = true }
ureq = { version = "3.4.1", default-features = false, features = ["rustls"], optional = true }
url = { version = "2.5", optional = true }
walkdir = { version = "2.5", optional = true }
zip = { version = "9", default-features = false, features = ["deflate-flate2"], optional = true }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs", "process"], optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_SystemServices", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Services"], optional = true }

[dev-dependencies]
flate2 = "1.1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
toml = "1.1"

[target.'cfg(target_os = "linux")'.dev-dependencies]
signal-hook = "0.4"
sd-notify = "0.5"

[[example]]
name = "vtool"
required-features = ["local", "http-ureq", "zip", "tar", "blake3", "sha2", "serde"]

[[example]]
name = "toolhost"
path = "examples/toolhost/main.rs"
required-features = ["serde", "process"]

[[example]]
name = "toolhost-shim"
path = "examples/toolhost/shim.rs"

[[example]]
name = "toolhost-service"
path = "examples/toolhost/service_host.rs"
required-features = ["serde", "process"]

[[test]]
name = "examples"
path = "tests/examples/main.rs"
required-features = ["local", "http-ureq", "archive", "blake3", "sha2", "serde", "process"]

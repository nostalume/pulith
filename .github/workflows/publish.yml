name: Publish crate

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version already present in Cargo.toml
        required: true
        type: string
      revision:
        description: Full audited commit SHA on main
        required: true
        type: string
      confirm:
        description: Type publish to admit the irreversible registry write
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    if: github.ref == 'refs/heads/main' && inputs.confirm == 'publish'
    runs-on: ubuntu-latest
    environment: publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-10
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2

      - name: Admit revision and version
        shell: bash
        env:
          EXPECTED_REVISION: ${{ inputs.revision }}
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "$EXPECTED_REVISION"
          actual="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          test "$actual" = "$EXPECTED_VERSION"

      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-features
      - name: Build strict public documentation
        env:
          RUSTDOCFLAGS: -D warnings -D missing-docs
        run: cargo doc --locked --all-features --no-deps
      - run: cargo package --locked
      - run: sha256sum target/package/pulith-${{ inputs.version }}.crate

      - name: Acquire short-lived crates.io token
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish admitted revision
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

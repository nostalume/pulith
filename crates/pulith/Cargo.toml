[package]
name = "pulith"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Composable typed behaviors for acquiring, verifying, preparing, and applying artifacts"
repository = "https://github.com/lvyuemeng/pulith"

[features]
default = ["local", "sync"]
sync = []
async = []
runtime-tokio = ["async", "dep:tokio"]
local = ["dep:same-file", "dep:tempfile", "dep:walkdir"]
net = ["local", "dep:url", "dep:httpdate", "dep:governor"]
reqwest = ["net", "runtime-tokio", "dep:reqwest"]
ureq = ["net", "sync", "dep:ureq"]
hash = []
blake3 = ["hash", "dep:blake3", "dep:hex"]
sha2 = ["hash", "dep:sha2", "dep:hex"]
zip = ["local", "dep:zip"]
tar = ["local", "dep:tar"]
gzip = ["tar", "dep:flate2"]
xz = ["tar", "dep:xz2"]
zstd = ["tar", "dep:zstd"]

[dependencies]
blake3 = { workspace = true, optional = true }
flate2 = { workspace = true, optional = true }
governor = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
httpdate = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
same-file = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
tar = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
ureq = { workspace = true, optional = true }
url = { workspace = true, optional = true }
walkdir = { workspace = true, optional = true }
xz2 = { workspace = true, optional = true }
zip = { workspace = true, optional = true }
zstd = { workspace = true, optional = true }
